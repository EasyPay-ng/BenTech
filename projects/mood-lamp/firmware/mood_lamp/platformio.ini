; Standalone Mood Lamp sketch (talks to a stock WLED over HTTP).
; Usage:  pio run -t upload
;
; If you'd rather patch WLED itself, copy ../mod_mood_lamp.* into
; WLED/usermods/mood_lamp/ and add -D USERMOD_MOOD_LAMP to build_flags.

[env:esp32dev]
platform = espressif32@^6.5
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DARDUINOJSON_VERSION_MAJOR=6

lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
